<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07100f"><title>BANKROL 1.8.9</title><style>body{margin:0;background:#07100f;color:#f4f7f6;font:16px system-ui;display:grid;place-items:center;min-height:100vh}.box{text-align:center;max-width:720px;padding:24px}.spin{width:34px;height:34px;border:3px solid #24413a;border-top-color:#00d084;border-radius:50%;animation:s 1s linear infinite;margin:auto auto 14px}@keyframes s{to{transform:rotate(360deg)}}.err{color:#ff665e}</style></head><body><div class="box"><div class="spin"></div>Carregando BANKROL 1.8.9...</div><script>(async()=>{try{const urls=['/app189-0.txt','/app189-1.txt','/app189-2.txt','/app189-3.txt'];const parts=await Promise.all(urls.map(async u=>{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('Falha ao carregar '+u);return r.text()}));const b64=parts.join('').replace(/\s+/g,'');if(b64.length!==31576||b64.length%4!==0)throw new Error('Pacote incompleto: '+b64.length);const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();if(!html.includes('1.8.9-multiple-logic-validation'))throw new Error('Versão inválida');document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="box"><h2 class="err">Falha ao carregar</h2><p>'+e.message+'</p></div>';console.error(e)}})();</script></body></html>
