<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07100f"><title>BANKROL 1.8.7</title><style>body{margin:0;background:#07100f;color:#f4f7f6;font:16px system-ui;display:grid;place-items:center;min-height:100vh}.box{text-align:center}.spin{width:34px;height:34px;border:3px solid #24413a;border-top-color:#00d084;border-radius:50%;animation:s 1s linear infinite;margin:auto auto 14px}@keyframes s{to{transform:rotate(360deg)}}.err{max-width:520px;padding:24px}.retry{margin-top:14px;background:#00d084;color:#04120d;border:0;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer}</style></head><body><div class="box"><div class="spin"></div>Carregando BANKROL...</div><script>(async()=>{const wait=ms=>new Promise(r=>setTimeout(r,ms));async function loadPart(file){let last;for(let attempt=1;attempt<=4;attempt++){try{const url=new URL(file,location.href);url.searchParams.set('v','187-'+Date.now()+'-'+attempt);const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error(file+' ('+r.status+')');const t=await r.text();if(!t.trim())throw new Error(file+' vazio');return t}catch(e){last=e;if(attempt<4)await wait(700*attempt)}}throw last}try{const files=['h0.txt','h1.txt','h2.txt'];const parts=[];for(const f of files)parts.push(await loadPart(f));let b64=parts.join('').replace(/\s+/g,'');b64+='='.repeat((4-b64.length%4)%4);const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();if(!html.includes('Versão 1.8.7')||!html.includes('combinedOddInput')||!html.includes('Análise por faixa de cotação'))throw new Error('Conteúdo HTML incompleto');document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="box err"><h2>Não foi possível carregar</h2><p>'+String(e.message||e)+'</p><button class="retry" onclick="location.reload()">Tentar novamente</button></div>'}})();</script></body></html>
