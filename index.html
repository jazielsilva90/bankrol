    filtered.forEach(r=>{let name=dim==='timing'?(r.timing==='live'?'LIVE':'PRÉ'):String(r[dim]||'').trim();if(!name)name='Não informado';const k=name.toLocaleLowerCase('pt-BR');if(!groups.has(k))groups.set(k,{name,list:[]});groups.get(k).list.push(r)});
    const rows=[...groups.values()].map(g=>{const st=stats(g.list),odd=avg(g.list,r=>r.confidenceIndex);return{name:g.name,count:st.count,success:st.success,failure:st.failure,pending:st.pending,impact:st.impact,roi:st.roi,rate:st.rate,odd}}).filter(x=>x.count>=min);
    const ordered=[...rows].sort((a,b)=>metricValue(b,metric)-metricValue(a,metric)||b.count-a.count||a.name.localeCompare(b.name,'pt-BR'));
    const best=ordered.slice(0,5),worst=[...ordered].reverse().slice(0,5);
    const item=(x,i,worstFlag)=>`<div class="rank-item ${worstFlag?'worst':''}"><div class="rank-pos">${i+1}</div><div class="rank-name"><b>${esc(x.name)}</b><small>${x.success} certas · ${x.failure} erradas · ${x.pending} pendentes</small></div><div class="rank-stat"><small>${valueLabel[metric]}</small><b class="${metric==='impact'?(x.impact>=0?'pos':'neg'):''}">${fmtMetric(metricValue(x,metric),metric)}</b></div><div class="rank-stat"><small>Qtd</small><b>${x.count}</b></div><div class="rank-stat"><small>Acerto</small><b>${x.success}/${x.success+x.failure}</b></div><div class="rank-stat"><small>Odd média</small><b>${quote(x.odd)}</b></div><div class="rank-stat"><small>Retorno</small><b class="${x.impact>=0?'pos':'neg'}">${money(x.impact)}</b></div></div>`;
    $('#bestList').innerHTML=best.length?best.map((x,i)=>item(x,i,0)).join(''):'<div class="rank-empty">Sem dados suficientes para este filtro.</div>';
    $('#worstList').innerHTML=worst.length?worst.map((x,i)=>item(x,i,1)).join(''):'<div class="rank-empty">Sem dados suficientes para este filtro.</div>';
    const all=stats(filtered),bestOne=best[0],worstOne=worst[0];
    $('#rankOverall').innerHTML=`<div><small>Dimensão</small><b>${dimensions[dim]}</b></div><div><small>Grupos avaliados</small><b>${rows.length}</b></div><div><small>Total de análises</small><b>${filtered.length}</b></div><div><small>Retorno total</small><b class="${all.impact>=0?'pos':'neg'}">${money(all.impact)}</b></div><div><small>Melhor destaque</small><b>${esc(bestOne?.name||'—')}</b></div><div><small>Pior destaque</small><b>${esc(worstOne?.name||'—')}</b></div>`;
  }
  ['rankDim','rankMetric','rankMin','rankStatus'].forEach(id=>$('#'+id).onchange=draw);draw();
}function notes(){metrics(records);$('#ticker').innerHTML='';const allTeams=[...new Set([...records.flatMap(r=>[r.homeTeam,r.awayTeam,r.mainTeam]),...teamNotes.map(n=>n.team)].filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));const editingNote=notesEditing?teamNotes.find(n=>n.id===notesEditing):null;$('#content').innerHTML=`<div class="notes-layout"><article class="card"><div class="card-head"><div><div class="ey">CADERNO DE TIMES</div><h3>${editingNote?'Editar':'Nova'} anotação</h3></div></div><form id="noteForm"><div class="field"><label>TIME</label><input name="team" list="teamSuggestions" value="${esc(editingNote?.team||'')}" placeholder="Ex.: Palmeiras" required><datalist id="teamSuggestions">${allTeams.map(t=>`<option value="${esc(t)}"></option>`).join('')}</datalist></div><div class="field" style="margin-top:12px"><label>NOTAS</label><textarea name="content" style="min-height:220px" placeholder="Time forte em casa...&#10;Bola parada: ...&#10;Pênalti: ..." required>${esc(editingNote?.content||'')}</textarea></div><div class="actions" style="margin-top:14px"><button type="button" id="noteCancel" class="btn secondary">${editingNote?'Cancelar edição':'Limpar'}</button><button class="btn primary">Salvar anotação</button></div></form></article><article class="card"><div class="card-head"><div><div class="ey">PESQUISA</div><h3>Anotações salvas</h3></div><span id="notesCount" class="muted"></span></div><input id="notesSearch" class="notes-search" placeholder="Pesquisar por time ou conteúdo da nota"><div id="notesList" class="notes-list"></div></article></div>`;const drawNotes=()=>{const q=($('#notesSearch').value||'').trim().toLocaleLowerCase('pt-BR');const list=[...teamNotes].filter(n=>!q||String(n.team+' '+n.content).toLocaleLowerCase('pt-BR').includes(q)).sort((a,b)=>String(b.updatedAt||'').localeCompare(String(a.updatedAt||'')));$('#notesCount').textContent=`${list.length} ${list.length===1?'nota':'notas'}`;$('#notesList').innerHTML=list.length?list.map(n=>`<div class="team-note"><div class="team-note-head"><div><h4>${esc(n.team)}</h4><div class="notes-meta">Atualizado em ${new Date(n.updatedAt||Date.now()).toLocaleString('pt-BR')}</div></div><div class="note-actions"><button class="btn secondary edit-note" data-id="${n.id}">Editar</button><button class="btn danger delete-note" data-id="${n.id}">Excluir</button></div></div><p>${esc(n.content)}</p></div>`).join(''):`<div class="empty-state">Nenhuma anotação encontrada.</div>`;$$('.edit-note').forEach(b=>b.onclick=()=>{notesEditing=b.dataset.id;notes()});$$('.delete-note').forEach(b=>b.onclick=()=>{if(!confirm('Excluir esta anotação?'))return;teamNotes=teamNotes.filter(n=>n.id!==b.dataset.id);if(notesEditing===b.dataset.id)notesEditing=null;queue();drawNotes();toast('Anotação excluída')})};$('#notesSearch').oninput=drawNotes;$('#noteCancel').onclick=()=>{notesEditing=null;notes()};$('#noteForm').onsubmit=e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));o.team=String(o.team||'').trim();o.content=String(o.content||'').trim();if(!o.team||!o.content)return;const now=new Date().toISOString();if(editingNote){editingNote.team=o.team;editingNote.content=o.content;editingNote.updatedAt=now}else teamNotes.push({id:uid(),team:o.team,content:o.content,createdAt:now,updatedAt:now});notesEditing=null;queue();toast('Anotação salva');notes()};drawNotes()}function settings(){metrics(records);$('#ticker').innerHTML='';$('#content').innerHTML=`<article class="card"><div class="card-head"><div><div class="ey">AJUSTES</div><h3>Dados e sincronização</h3></div></div><p class="muted">A versão 1.8.7 de validação usa a mesma conta, a mesma tabela e os mesmos registros sincronizados da versão oficial.</p><div class="actions" style="margin-top:16px"><button id="export" class="btn secondary">Exportar JSON</button><button id="syncNow" class="btn primary">Sincronizar agora</button></div></article>`;$('#syncNow').onclick=()=>save();$('#export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(records,null,2)],{type:'application/json'}));a.download='bankrol-backup.json';a.click();URL.revokeObjectURL(a.href)}}function render(){if(page==='dash')dash();else if(page==='new')newForm();else if(page==='history')history();else if(page==='rankings')rankings();else if(page==='notes')notes();else settings()}function go(p){page=p;$$('[data-page]').forEach(b=>b.classList.toggle('on',b.dataset.page===p));$('#title').textContent={dash:'Dashboard',new:'Nova Análise',history:'Histórico',rankings:'Melhores / Piores',notes:'Anotações',settings:'Ajustes'}[p];render();scrollTo({top:0,behavior:'smooth'})}$$('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));function setAuth(m){authMode=m;$('#loginTab').classList.toggle('on',m==='login');$('#signupTab').classList.toggle('on',m==='signup');$('#authTitle').textContent=m==='login'?'Entrar':'Criar conta';$('#authBtn').textContent=m==='login'?'Entrar':'Criar conta'}$('#loginTab').onclick=()=>setAuth('login');$('#signupTab').onclick=()=>setAuth('signup');$('#authForm').onsubmit=async e=>{e.preventDefault();const em=$('#email').value.trim(),pw=$('#password').value,b=$('#authBtn');b.disabled=true;b.textContent='Aguarde...';$('#authMsg').textContent='';try{const d=await api(authMode==='login'?'/auth/v1/token?grant_type=password':'/auth/v1/signup',{method:'POST',body:JSON.stringify({email:em,password:pw,data:{project:'bankrol-analysis'}})});if(d?.access_token){session=d;user=d.user;write(K.s,d);await open()}else $('#authMsg').textContent='Conta criada. Confirme o e-mail e entre.'}catch(x){$('#authMsg').textContent=x.message==='Invalid login credentials'?'E-mail ou senha inválidos.':x.message}finally{b.disabled=false;b.textContent=authMode==='login'?'Entrar':'Criar conta'}};async function open(){setSync('Sincronizando...');await hydrate();$('#auth').classList.add('hide');$('#app').classList.remove('hide');$('#userEmail').textContent=user.email||'';render()}$('#logout').onclick=()=>{localStorage.removeItem(K.s);location.reload()};(async()=>{if(session?.access_token){user=session.user;try{await open()}catch{localStorage.removeItem(K.s)}}})();
</script></body></html>
