name: Publicar BANKROL 1.8.9
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-static.yml'
      - 'publish_1_8_9.py'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar index.html
        run: python publish_1_8_9.py
      - name: Validar JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          h=Path('index.html').read_text(encoding='utf-8')
          js='\n'.join(re.findall(r'<script>(.*?)</script>', h, flags=re.S))
          Path('/tmp/bankrol.js').write_text(js, encoding='utf-8')
          PY
          node --check /tmp/bankrol.js
      - name: Commit da publicação
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Publica BANKROL 1.8.9 com país e múltiplas"
          git push
