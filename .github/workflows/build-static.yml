name: Ajusta contagem semanal BANKROL
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-static.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar múltipla no dashboard semanal
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '${weekdayAnalysis(analysisList)}'
          new = '${weekdayAnalysis(list)}'
          if old not in s:
              raise SystemExit('Trecho esperado não encontrado')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit da correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Corrige contagem de múltiplas no dashboard semanal"
          git push
