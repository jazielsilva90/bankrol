name: Build static BANKROL
on:
  push:
    branches: [main]
    paths:
      - 'h0.txt'
      - 'h1.txt'
      - 'h2.txt'
      - 'build.js'
      - 'package.json'
      - 'vercel.json'
      - '.github/workflows/build-static.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run build
      - name: Commit generated HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/index.html
          git diff --cached --quiet || git commit -m "Gera index estático BANKROL 1.8.7"
          git push
