name: Publicar BANKROL 1.8.9
on:
  push:
    branches: [main]
    paths:
      - 'publish_1_8_9.py'
      - '.github/workflows/publish-1-8-9.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restaurar base compatível
        run: curl -fsSL 'https://raw.githubusercontent.com/jazielsilva90/bankrol/5949ad76cf97e493a693c4eb2676feccceabc1d3/index.html' -o index.html
      - name: Atualizar index.html
        run: python publish_1_8_9.py
      - name: Validar JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          h=Path('index.html').read_text(encoding='utf-8')
          js='\n'.join(re.findall(r'<script>(.*?)</script>', h, flags=re.S))
          Path('/tmp/bankrol.js').write_text(js, encoding='utf-8')
          PY
          node --check /tmp/bankrol.js
      - name: Publicar versão
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Publica BANKROL 1.8.9 diretamente"
          git push
